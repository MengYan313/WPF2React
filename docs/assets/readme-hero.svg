<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">WPF2React</title>
  <desc id="desc">Animated migration from a WPF window through a dependency graph into a React and Material UI application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#07162c"/>
      <stop offset="1" stop-color="#102344"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".3"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="migration-flow" d="M720 212 C774 212 779 153 828 153 S881 213 932 213"/>
    <style>
      .dash { stroke-dasharray: 6 10; animation: dash 6s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin:center; animation: pulse 2.6s ease-in-out infinite; }
      .late { animation-delay:1.05s; }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset:-160 } }
      @keyframes pulse { 0%,100% { opacity:.55; transform:scale(.9) } 50% { opacity:1; transform:scale(1.18) } }
      @keyframes float { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-6px) } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="76" r="275" fill="url(#glow)"/>
  <path d="M0 353C218 292 360 428 570 350S970 302 1200 358V420H0Z" fill="#020617" opacity=".5"/>

  <g transform="translate(62 62)">
    <g transform="translate(0 2)">
      <rect width="46" height="46" rx="13" fill="#101a34" stroke="#67e8f9" stroke-opacity=".55"/>
      <path d="M10 13h13v19H10zM26 13h10v8H26zM26 24h10v8H26z" fill="none" stroke="url(#brand)" stroke-width="2.2"/>
    </g>
    <text x="0" y="106" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="53" font-weight="750" letter-spacing="-2">WPF2React</text>
    <rect x="1" y="121" width="323" height="4" rx="2" fill="url(#brand)"/>
    <text x="1" y="159" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">Dependency-aware WPF to React + Material UI migration</text>
    <text x="1" y="190" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.6">STATIC ANALYSIS  /  MUI RETRIEVAL  /  MULTI-AGENT ORCHESTRATION</text>

    <g transform="translate(0 229)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <g>
        <rect width="142" height="67" rx="16" fill="#0f1934" stroke="#60a5fa" stroke-opacity=".38"/>
        <text x="18" y="29" fill="#f8fafc" font-size="22" font-weight="750">3</text>
        <text x="18" y="50" fill="#94a3b8" font-size="12">full projects</text>
      </g>
      <g transform="translate(155)">
        <rect width="142" height="67" rx="16" fill="#0f1934" stroke="#22d3ee" stroke-opacity=".38"/>
        <text x="18" y="29" fill="#f8fafc" font-size="22" font-weight="750">9 / 9</text>
        <text x="18" y="50" fill="#94a3b8" font-size="12">pages compiled</text>
      </g>
      <g transform="translate(310)">
        <rect width="142" height="67" rx="16" fill="#0f1934" stroke="#a78bfa" stroke-opacity=".38"/>
        <text x="18" y="29" fill="#f8fafc" font-size="22" font-weight="750">45</text>
        <text x="18" y="50" fill="#94a3b8" font-size="12">components migrated</text>
      </g>
    </g>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g class="float">
      <rect x="650" y="88" width="174" height="245" rx="18" fill="#0b142c" stroke="#60a5fa" stroke-opacity=".5"/>
      <rect x="650" y="88" width="174" height="34" rx="18" fill="#14213f"/>
      <path d="M650 105a17 17 0 0017 17h140a17 17 0 0017-17" fill="#14213f"/>
      <circle cx="674" cy="105" r="4" fill="#fb7185"/><circle cx="690" cy="105" r="4" fill="#fbbf24"/><circle cx="706" cy="105" r="4" fill="#34d399"/>
      <text x="720" y="109" fill="#94a3b8" font-size="10">LoginView.xaml</text>
      <rect x="670" y="142" width="134" height="46" rx="8" fill="#172342"/>
      <text x="683" y="162" fill="#93c5fd" font-size="10">&lt;Grid&gt;</text><text x="683" y="178" fill="#64748b" font-size="9">rows + bindings</text>
      <rect x="670" y="200" width="134" height="38" rx="8" fill="#172342"/>
      <text x="683" y="223" fill="#c4b5fd" font-size="10">&lt;TextBox /&gt;</text>
      <rect x="670" y="250" width="134" height="54" rx="8" fill="#172342"/>
      <text x="683" y="272" fill="#67e8f9" font-size="10">&lt;Button&gt;</text><text x="683" y="289" fill="#64748b" font-size="9">Command binding</text>
    </g>
  </g>

  <g>
    <path d="M720 212 C774 212 779 153 828 153 S881 213 932 213" fill="none" stroke="url(#brand)" stroke-opacity=".62" stroke-width="2.2" class="dash"/>
    <path d="M810 256C831 244 840 226 838 204M858 185C875 194 890 209 932 213" fill="none" stroke="#64748b" stroke-opacity=".45"/>
    <circle cx="840" cy="206" r="34" fill="#0d1933" stroke="#22d3ee" stroke-opacity=".72"/>
    <circle cx="840" cy="206" r="8" fill="#e0f2fe" class="pulse" filter="url(#soft-glow)"/>
    <circle cx="810" cy="256" r="7" fill="#60a5fa" class="pulse late"/>
    <circle cx="858" cy="185" r="7" fill="#a78bfa" class="pulse"/>
    <text x="803" y="323" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="1">DEPENDENCIES</text>
    <circle r="4.5" fill="#ecfeff" filter="url(#soft-glow)"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#migration-flow"/></animateMotion></circle>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)" class="float">
    <rect x="922" y="70" width="224" height="280" rx="20" fill="#f8fafc"/>
    <rect x="922" y="70" width="224" height="42" rx="20" fill="#101a34"/>
    <path d="M922 91a21 21 0 0021 21h182a21 21 0 0021-21" fill="#101a34"/>
    <circle cx="947" cy="91" r="4" fill="#fb7185"/><circle cx="963" cy="91" r="4" fill="#fbbf24"/><circle cx="979" cy="91" r="4" fill="#34d399"/>
    <text x="1045" y="95" text-anchor="middle" fill="#94a3b8" font-size="10">React + MUI</text>
    <rect x="944" y="133" width="180" height="40" rx="10" fill="#e0f2fe"/>
    <circle cx="963" cy="153" r="8" fill="#0ea5e9"/>
    <rect x="979" y="146" width="90" height="6" rx="3" fill="#64748b" opacity=".6"/>
    <rect x="979" y="157" width="58" height="5" rx="2.5" fill="#94a3b8" opacity=".45"/>
    <text x="944" y="201" fill="#475569" font-size="10">USERNAME</text>
    <rect x="944" y="211" width="180" height="32" rx="7" fill="#eef2ff" stroke="#cbd5e1"/>
    <text x="956" y="231" fill="#94a3b8" font-size="10">React state binding</text>
    <text x="944" y="268" fill="#475569" font-size="10">PASSWORD</text>
    <rect x="944" y="278" width="180" height="32" rx="7" fill="#eef2ff" stroke="#cbd5e1"/>
    <rect x="976" y="324" width="116" height="30" rx="15" fill="url(#brand)"/>
    <text x="1034" y="343" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">LOG IN</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="27.5" fill="none" stroke="url(#brand)" stroke-opacity=".38"/>
</svg>
